version: 1
name: balance-demo
limits:
  min_records: 1
  max_records: 10
fields:
  REC-TYPE:
    required: true
    enum: ["D"]
  ACCOUNT-ID:
    required: true
    pattern: "^ACCT[0-9]{8}$"
  AMOUNT:
    required: true
    range:
      min: "-999999999.99"
      max: "999999999.99"
    scale: 2
  RATE:
    required: true
    range:
      min: "0"
      max: "999.9999"
    scale: 4
  BOOK-DATE:
    required: true
    date_format: "%Y%m%d"
  MEMO:
    required: true
    pattern: "^[A-Z0-9 -]+$"
record_rules:
  - name: balance-account-unique
    kind: unique_key
    fields: [ACCOUNT-ID]
